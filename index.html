<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 3 – Responsive Quiz & API</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Interactive Quiz & Joke API</h1>
  </header>

  <section class="quiz-section">
    <h2>Quiz: JavaScript Basics</h2>
    <div id="quiz">
      <p id="question"></p>
      <div id="options"></div>
      <button id="nextBtn">Next</button>
    </div>
    <p id="score"></p>
  </section>

  <section class="api-section">
    <h2>Need a Laugh?</h2>
    <button id="jokeBtn">Get a Random Joke</button>
    <p id="jokeDisplay"></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
